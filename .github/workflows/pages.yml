# Publishes site/ to GitHub Pages. The site is static: the result viewer reads JSON in the browser.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# queued, not cancelled: a cancelled run would skip announcing its results, and the next push's
# range starts after them
concurrency:
  group: pages
  cancel-in-progress: false

# upload and deploy are separate jobs: deploy-pages in the same job as the upload can look the
# artifact up before GitHub lists it ("Found 0 artifact(s)")
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a result file added without rerunning build-index.sh would show as unverified
      - name: Check results/index.json is up to date
        shell: bash
        run: |
          jq -S . site/results/index.json >"$RUNNER_TEMP/committed.json"
          sh site/build-index.sh
          diff <(jq -S . site/results/index.json) "$RUNNER_TEMP/committed.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # posts official results that are new or changed in this push to Discord, once they're live
  announce:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Announce score updates
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_SCORES }}
        run: python3 .github/announce.py scores "${{ github.event.before }}" "${{ github.sha }}"
