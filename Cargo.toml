[package]
name = "rosetta"
version = "0.1.0"
edition = "2024"
description = "A standardized, open-source benchmark for Luau decompilers"
repository = "https://github.com/Scrensayol/rosetta"
publish = false

[[bin]]
name = "rosetta"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# pinned: the Luau version decides what the reference programs compile to, so moving it
# is a baseline change, not something a fresh resolve should do on its own
mlua = { version = "=0.12.2", features = ["luau", "vendored"] }
luau0-src = "=0.22.0"
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"
