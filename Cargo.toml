[package]
name = "rosetta"
version = "0.1.0"
edition = "2024"
description = "A standardized, open-source benchmark for Luau decompilers"
repository = "https://github.com/Scrensayol/rosetta"
license = "MIT"
publish = false

# its own workspace, also when checked out inside another (sunberry's CI does that)
[workspace]

[[bin]]
name = "rosetta"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# pinned: the Luau version decides what the reference programs compile to, so moving it
# is a baseline change, not something a fresh resolve should do on its own
# mlua's main branch, pinned to a commit: released mlua (0.12.2) can't take luau0-src 0.24, and
# Luau 746 is the first with `while local`
mlua = { git = "https://github.com/mlua-rs/mlua", rev = "3c0fd858825a4756e5e858356c3c70ab83e64dbe", features = ["luau", "vendored"] }
luau0-src = "=0.24.0"
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"
